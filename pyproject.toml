[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools]
packages = ["todo"]

[tool.setuptools.package-data]
todo = ["skill/*", "skill/**/*"]
