about: use shipped resolves from the registry, unknown names and missing code are errors, custom code runs, repo commands are refused, and a stored instance of a shipped plugin gets the host's connection
config: shipped.yaml
code: {coded: repo-coded.js}
storedInstances:
  pr-link: [{id: mine, name: Mine}]
hostConnections:
  github: {http: {url: "http://fake-github"}}
event: {type: push, branch: feat/login}
item: {branches: [feat/login]}
responses:
  github:
    - {method: GET, path: /repos/acme/web/pulls?head=acme%3Afeat%2Flogin&state=all, body: []}
expect:
  errors: ["plugin nope: no plugin named nope ships with todo", "plugin missing: no code is stored for missing.js"]
  track: []
  results:
    - {plugin: pr-link, instance: mine, result: {attached: [], wouldSend: [], log: []}}
    - {plugin: coded, instance: default, result: {attached: [{kind: log, key: "log:fix-login pushed to feat/login", text: fix-login pushed to feat/login}], wouldSend: [], log: []}}
    - {plugin: local, instance: default, result: {attached: [], wouldSend: [], log: [], skipped: "local: `local` runs a command, which this host doesn't allow for repo connections"}}
