about: in dry-run, watchtower-session reads the roster and records the session it would start
plugin: watchtower-session
instance: {id: start, name: Start agent}
event: {type: manual, instance: start}
dry_run: true
connections:
  watchtower: {kind: http}
responses:
  watchtower:
    - {method: GET, path: /api/roster, body: {sessions: []}}
expect:
  attached: []
  wouldSend:
    - {connection: watchtower, method: POST, path: /api/sessions, input: {dir: /src/web, name: "todo: fix-login", initialPrompt: /todo fix-login}}
received:
  watchtower:
    - {method: GET, path: /api/roster}
