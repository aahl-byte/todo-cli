# Hands the item to a Claude session in Watchtower, as a watchtower Action did:
# sends to the item's live session, resumes its stopped one, or starts one.
connections: [watchtower]
on: [manual]
code: watchtower-session.js
gave_up: "action {{instance.name}} ({{trigger}}) gave up after {{attempts}} attempts: {{error}}"
settings:
  dir:          {label: Folder, type: text, default: "{{item.dir}}"}
  prompt:       {label: Prompt, type: long-text, default: "/todo {{item.id}}"}
  resumePrompt: {label: Prompt for a live or resumed session, type: long-text, optional: true}
  model:        {label: Model, type: choice, options: [opus, sonnet], optional: true}
  link:         {label: Watchtower address for session links, type: text, optional: true}
